<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PettiBox</title>
  <link rel="stylesheet" href="popup.css">
  <style>
    body { width: auto; max-height: none; min-height: 100vh; display: flex; flex-direction: column; padding: 16px 24px; gap: 12px; }
    header { display: flex; align-items: baseline; gap: 12px; }
    header h1 { font-size: 16px; margin: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #count { color: var(--ink-2); font-weight: 600; }
    .stage { flex: 1; display: flex; align-items: center; gap: 12px; min-height: 0; }
    .nav { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--edge); background: var(--bright); color: var(--ink); font-size: 22px; cursor: pointer; }
    .nav:disabled { opacity: .3; cursor: default; }
    #box { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; min-height: 60vh; }
    #box p { max-width: 420px; }
    #box img, #box video { max-width: 100%; max-height: 78vh; border-radius: 12px; box-shadow: 0 2px 16px rgba(0,0,0,.15); }
    #box iframe { width: 100%; height: 78vh; border: 0; border-radius: 12px; background: #fff; }
    .open { font-weight: 600; }
    #strip { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 8px; justify-content: safe center; }
    .tile { flex: none; width: 64px; height: 64px; border-radius: 10px; border: 2px solid transparent; background: var(--bright); font-size: 24px; cursor: pointer; padding: 0; overflow: hidden; }
    .tile.on { border-color: var(--accent, #E2725B); }
    .tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  </style>
</head>
<body>
  <header><h1 id="title"></h1><span id="count"></span></header>
  <div class="stage">
    <button id="prev" class="nav" aria-label="Previous" hidden>‹</button>
    <div id="box"><p>Loading…</p></div>
    <button id="next" class="nav" aria-label="Next" hidden>›</button>
  </div>
  <nav id="strip" hidden aria-label="All files in this save"></nav>
  <script type="module" src="viewer.js"></script>
</body>
</html>
