name: Bug report
description: Something in PettiBox crashed, misbehaved or looks wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open ...\n2. Tap ...\n3. See ..."
  - type: input
    id: context
    attributes:
      label: Context
      description: What you were saving (link, text, image, PDF) and which app you shared it from
  - type: input
    id: device
    attributes:
      label: Phone model and Android version
      placeholder: "Pixel 8, Android 16"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: PettiBox version
      description: Android Settings > Apps > PettiBox
      placeholder: "2.0.12"
    validations:
      required: true
